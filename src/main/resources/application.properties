spring.application.name=stockflow-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${DB_USERNAME:stockflow}
spring.datasource.password=${DB_PASSWORD:stockflow}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
